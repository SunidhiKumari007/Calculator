<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="calculator">

        <input
            class="display"
            type="text"
            value="0"
            readonly
            aria-label="Calculator display"
        >

        <div class="buttons">
            <button type="button" data-action="clear" class="clear">AC</button>
            <button type="button" data-action="cut" class="cut" aria-label="Delete last character">×</button>
            <button type="button" data-value="%">%</button>
            <button type="button" data-value="÷" class="operator">÷</button>

            <button type="button" data-value="7">7</button>
            <button type="button" data-value="8">8</button>
            <button type="button" data-value="9">9</button>
            <button type="button" data-value="×" class="operator">×</button>

            <button type="button" data-value="4">4</button>
            <button type="button" data-value="5">5</button>
            <button type="button" data-value="6">6</button>
            <button type="button" data-value="−" class="operator">−</button>

            <button type="button" data-value="1">1</button>
            <button type="button" data-value="2">2</button>
            <button type="button" data-value="3">3</button>
            <button type="button" data-value="+" class="operator">+</button>

            <button type="button" data-value="0" class="zero">0</button>
            <button type="button" data-value=".">.</button>
            <button type="button" data-action="calculate" class="equals">=</button>
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
